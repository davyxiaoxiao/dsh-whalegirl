name: desktop

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Core tests
        run: cargo test -p whalegirl-core

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        run: pnpm tauri build

      # MSI (WiX) is limited to codepage 1252 here and cannot carry the Chinese
      # product name; NSIS is Unicode and is the Windows installer we ship.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: whalegirl-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/macos/*.app

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: whalegirl-${{ matrix.name }}
          if-no-files-found: error
          path: desktop/target/release/bundle/nsis/*.exe

      # Tag builds attach the installer to the existing (draft) release, so it
      # never has to be downloaded through the slow artifact proxy first.
      - name: Attach Windows installer to release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/nsis/*.exe --clobber

      # Run the real installer and app on a Windows runner. This turns the
      # startup log into an actionable CI failure instead of a user report.
      - name: Windows install / launch smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          Write-Host "Installing $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3

          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter 'whalegirl-app.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $app) { throw 'installed whalegirl-app.exe not found under LOCALAPPDATA' }
          Write-Host "Launching $($app.FullName)"
          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 12

          $log = Join-Path $env:LOCALAPPDATA 'com.daiwei.whalegirl\logs\whalegirl.log'
          if (Test-Path $log) {
            Write-Host '--- whalegirl.log ---'
            Get-Content $log -Tail 100
          } else {
            Write-Warning "No startup log at $log (failure happened before Rust main; check WebView2)"
          }

          $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $running) {
            Write-Host '--- recent Application errors ---'
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'whalegirl|WebView2|Application Error' } |
              Select-Object -First 5 TimeCreated,ProviderName,Message | Format-List | Out-String | Write-Host
            throw 'whalegirl-app.exe exited during the 12s smoke window'
          }
          Write-Host 'whalegirl-app.exe is still running after 12s'

          # The task board webview is created lazily; exercising it verifies the
          # second WebView2 environment on the same Windows runner.
          Write-Host 'Opening the task board (lazy second webview)...'
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:47113/board' -TimeoutSec 5 | Out-Null
          Start-Sleep -Seconds 4
          if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
            Write-Host '--- whalegirl.log after board open ---'
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw 'whalegirl-app.exe exited while creating the board webview'
          }
          Write-Host 'board opened; process is still running'

          Stop-Process -Id $proc.Id -Force
