name: desktop

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Core tests
        run: cargo test -p whalegirl-core

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        run: pnpm tauri build

      # MSI (WiX) is limited to codepage 1252 here and cannot carry the Chinese
      # product name; NSIS is Unicode and is the Windows installer we ship.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: whalegirl-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/macos/*.app

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: whalegirl-${{ matrix.name }}
          if-no-files-found: error
          path: desktop/target/release/bundle/nsis/*.exe

      # Tag builds attach the installer to the existing (draft) release, so it
      # never has to be downloaded through the slow artifact proxy first.
      - name: Attach Windows installer to release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/nsis/*.exe --clobber
